# .opencode/config.yaml
project:
  name: k8s-platform
  description: Multi-cloud Kubernetes platform infrastructure
  version: 1.0.0

agent:
  model: claude-opus-4-1  # Latest Claude model; auto-updates
  temperature: 0.7
  max_tokens: 8192
  
  # Instruction context — loaded into every session
  instructions:
    - .opencode/instructions/platform-conventions.md
    - .opencode/instructions/incident-response.md
    - .opencode/instructions/terraform-guidelines.md

  # Skills available via /skill-name commands
  skills:
    - kubernetes-troubleshooting
    - terraform-validator
    - helm-chart-reviewer
    - incident-generator
    - runbook-writer

  # Agents available via /agent-name commands
  agents:
    - code-reviewer
    - security-auditor
    - devops-oncall

  # Hooks: auto-run on events (no agent context)
  hooks:
    pre-commit:
      - terraform-lint
      - helm-lint
      - k8s-manifest-validate
    post-edit:
      - auto-format
      - run-tests

# OpenCode CLI preferences
cli:
  theme: auto                    # auto, light, dark
  editor: $EDITOR               # fallback to VS Code
  pager: less
  auto_confirm: false           # require approval for destructive ops
  timeout_seconds: 300
  
  # Show git status in prompt
  git_status: true
  
  # Show token usage per response
  show_usage: true
  
  # Persist session history
  history: .opencode/history.log

# Local MCP servers (for advanced tooling)
mcp_servers: []

# Environment-specific config
environments:
  dev:
    context: dev-context.md
    git_branch: develop
  staging:
    context: staging-context.md
    git_branch: staging
  prod:
    context: prod-context.md
    git_branch: main
    auto_confirm: true  # Never auto-approve in prod
    timeout_seconds: 600

